
input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "elk-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
